name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - prod
  pull_request:
    branches:
      - main
      - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}

jobs:
  # 🧪 Tests (comme dans votre version qui marchait)
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: 🎨 Check Prettier formatting
        run: npm run format:check
        continue-on-error: true

      - name: 🧪 Run unit tests
        run: npm run test:run
        env:
          CI: true

      - name: 📊 Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: 🔒 Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # 🏗️ Build & Deploy (seulement sur prod)
  build-and-push:
    needs: test-and-quality
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # 🚀 Deploy
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query 'taskDefinition' > current-task-def.json

      - name: 🛠️ Create new task definition with updated image
        run: |
          IMAGE_URI=${{ needs.build-and-push.outputs.image }}
          jq --arg IMAGE "$IMAGE_URI" \
             'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .placementConstraints)
              | .containerDefinitions[0].image = $IMAGE' \
             current-task-def.json > task-definition-new.json

      - name: 🚀 Deploy to ECS avec rollback si échec
        run: |
          # Sauvegarder la revision actuelle
          CURRENT_REVISION=$(cat current-task-def.json | jq -r '.revision')
          echo "Revision de sauvegarde: $CURRENT_REVISION"

          # Déployer la nouvelle version
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --deployment-configuration "minimumHealthyPercent=50,maximumPercent=200" \
            --force-new-deployment

          # Attendre avec timeout plus long (20 minutes pour les connexions DB)
          echo "Attente du déploiement (timeout 20 min)..."
          timeout 1200 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} || {
            
            echo "❌ Déploiement échoué ou timeout - Rollback automatique"
            
            # Rollback vers la version précédente
            aws ecs update-service \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service ${{ env.ECS_SERVICE }} \
              --task-definition ${{ env.ECS_SERVICE }}:$CURRENT_REVISION \
              --force-new-deployment
            
            echo "Attente du rollback..."
            aws ecs wait services-stable \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }}
            
            echo "❌ Rollback effectué vers revision $CURRENT_REVISION"
            exit 1
          }

          echo "✅ Déploiement réussi!"
