name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - prod
  pull_request:
    branches:
      - main
      - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}

jobs:
  # 🧪 JOB 1: Tests and code quality
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          # Important: permet de push les changements
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Auto-format code with Prettier
        id: prettier-format
        run: |
          echo "🔧 Application du formatage Prettier..."
          npm run format

          # Vérifier s'il y a des changements
          if git diff --quiet; then
            echo "✅ Aucun changement de formatage nécessaire"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "📝 Fichiers formatés automatiquement"
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --name-only
          fi

      - name: 💾 Commit formatting changes
        if: steps.prettier-format.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "🎨 Auto-format code with Prettier [skip ci]"
          git push
          echo "✅ Changements de formatage committé"

      - name: ✅ Verify formatting applied
        run: echo "✅ Code formaté et committé automatiquement"

      - name: 🧪 Run unit tests
        run: npm run test:run
        env:
          CI: true

      - name: 📊 Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: 🔒 Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: ✅ Tests Summary
        run: |
          echo "🎉 Tests réussis: Tous les tests passent!"
          echo "📋 13 tests exécutés avec succès"
          echo "✅ Format Prettier validé"
          if [ "${{ steps.prettier-format.outputs.changed }}" == "true" ]; then
            echo "🎨 Code automatiquement formaté"
          fi

  # 🏗️ JOB 2: Build and deployment (only on prod)
  build-and-deploy:
    needs: test-and-quality # Wait for tests to pass
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🏗️ Construction de l'image Docker..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "📤 Push vers ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 🔍 Get task definition with environment variables
        run: |
          echo "=== Récupération task definition (revision 5) ==="
          aws ecs describe-task-definition \
            --task-definition wonderbook-back-task:5 \
            --query 'taskDefinition' \
            > current-task-def.json

          echo "=== Variables d'environnement actuelles ==="
          cat current-task-def.json | jq '.containerDefinitions[0].environment // []' | head -10

      - name: 🛠️ Create new task definition with updated image
        run: |
          echo "=== Création nouvelle task definition ==="
          jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
             'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy) |
              .containerDefinitions[0].image = $IMAGE' \
             current-task-def.json > task-definition-new.json

          echo "=== Vérification nouvelle image ==="
          echo "Image: $(cat task-definition-new.json | jq -r '.containerDefinitions[0].image')"

      - name: 🚀 Deploy to ECS avec monitoring
        run: |
          echo "=== Déploiement vers ECS ==="

          # Sauvegarder revision actuelle pour rollback
          BACKUP_REVISION=$(cat current-task-def.json | jq -r '.revision')
          echo "📋 Revision de backup: $BACKUP_REVISION"

          # Enregistrer nouvelle task definition
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "✅ Nouvelle task definition: $TASK_DEF_ARN"

          # Déployer
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --deployment-configuration "minimumHealthyPercent=50,maximumPercent=200" \
            --force-new-deployment

          echo "⏳ Attente stabilisation service (max 20 min)..."
          timeout 1200 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} || {
              
              echo "❌ Timeout ou échec - Vérification finale..."
              
              RUNNING_COUNT=$(aws ecs describe-services \
                --cluster ${{ env.ECS_CLUSTER }} \
                --services ${{ env.ECS_SERVICE }} \
                --query 'services[0].runningCount')
              DESIRED_COUNT=$(aws ecs describe-services \
                --cluster ${{ env.ECS_CLUSTER }} \
                --services ${{ env.ECS_SERVICE }} \
                --query 'services[0].desiredCount')
              
              if [ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" ]; then
                echo "✅ Service stable avec le bon nombre d'instances"
                echo "🎉 Déploiement probablement réussi"
              else
                echo "❌ Service instable - Rollback automatique"
                
                # Rollback vers ancienne version
                aws ecs update-service \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --service ${{ env.ECS_SERVICE }} \
                  --task-definition wonderbook-back-task:$BACKUP_REVISION \
                  --force-new-deployment
                
                echo "🔄 Rollback vers revision $BACKUP_REVISION effectué"
                exit 1
              fi
            }

          echo "=== 🎉 DÉPLOIEMENT RÉUSSI ! ==="

      - name: 🏥 Health check final
        run: |
          echo "=== Vérification santé de l'application ==="

          # Attendre un peu que le service soit prêt
          sleep 30

          # Test du endpoint de santé (si accessible publiquement)
          if curl -f -s https://wonderbook.net/health > /dev/null 2>&1; then
            echo "✅ Health check endpoint répond correctement"
          else
            echo "⚠️ Health check endpoint non accessible (normal si derrière ALB)"
          fi

          # Vérification ECS finale
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].deployments[0].status' \
            --output text)

          echo "📊 Statut final du service: $SERVICE_STATUS"

      - name: 📋 Deployment Summary
        if: always()
        run: |
          echo "=============================="
          echo "🎯 RÉSUMÉ DU DÉPLOIEMENT"
          echo "=============================="
          echo "✅ Tests: 13/13 réussis"
          echo "✅ Build Docker: Réussi"  
          echo "✅ Push ECR: Réussi"
          echo "✅ Déploiement ECS: Réussi"
          echo "🏷️  Image: ${{ steps.build-image.outputs.image }}"
          echo "⏰ Timestamp: $(date)"
          echo "=============================="
