name: Deploy to ECS (prod)
on:
  push:
    branches:
      - prod
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ecs-task-def.json
  CONTAINER_NAME: wonderbook-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Debug container name and original task definition
        run: |
          echo "=== Container name from secret ==="
          echo "Container name: ${{ secrets.CONTAINER_NAME }}"
          echo "Container name length: ${#CONTAINER_NAME}"
          echo ""
          echo "=== Original task definition ==="
          cat ${{ env.ECS_TASK_DEFINITION }}
          echo ""
          echo "=== Container names in original task definition ==="
          cat ${{ env.ECS_TASK_DEFINITION }} | jq '.containerDefinitions[].name'
        env:
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

      - name: Render ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: wonderbook-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Debug rendered task definition
        run: |
          echo "=== Rendered task definition file path ==="
          echo "${{ steps.task-def.outputs.task-definition }}"
          echo ""
          echo "=== Rendered task definition content ==="
          cat ${{ steps.task-def.outputs.task-definition }}
          echo ""
          echo "=== Container names in rendered task definition ==="
          cat ${{ steps.task-def.outputs.task-definition }} | jq '.containerDefinitions[].name'

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true