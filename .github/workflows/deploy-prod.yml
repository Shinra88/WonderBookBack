name: Deploy to ECS (prod)

on:
  push:
    branches:
      - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Get task definition with environment variables
        run: |
          echo "=== Getting task definition revision 5 (with environment variables) ==="
          aws ecs describe-task-definition \
            --task-definition wonderbook-back-task:5 \
            --query 'taskDefinition' \
            > current-task-def.json
          
          echo "=== Task definition content ==="
          cat current-task-def.json
          
          echo "=== Environment variables found ==="
          cat current-task-def.json | jq '.containerDefinitions[0].environment // []'

      - name: Create new task definition with updated image
        run: |
          echo "=== Creating new task definition with updated image ==="
          jq --arg IMAGE "${{ steps.build-image.outputs.image }}" \
             'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy) | 
              .containerDefinitions[0].image = $IMAGE' \
             current-task-def.json > task-definition-new.json

      - name: Deploy to ECS
        run: |
          echo "=== Registering new task definition ==="
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "New task definition registered: $TASK_DEF_ARN"

          echo "=== Updating ECS service with rolling deployment ==="
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --deployment-configuration "minimumHealthyPercent=50,maximumPercent=200" \
            --force-new-deployment

          echo "=== Waiting for service to become stable (max 15 minutes) ==="
          timeout 900 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} || {
            echo "Timeout reached, checking service status..."
            RUNNING_COUNT=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query 'services[0].runningCount')
            DESIRED_COUNT=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }} \
              --query 'services[0].desiredCount')
            
            if [ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" ]; then
              echo "Service is running with desired count, deployment likely successful"
              exit 0
            else
              echo "Service is not stable, deployment may have failed"
              exit 1
            fi
          }

          echo "=== Deployment completed successfully ==="