name: Deploy to ECS (prod)
on:
  push:
    branches:
      - prod
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_TASK_DEFINITION: ecs-task-def.json
  CONTAINER_NAME: wonderbook-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Debug container name and original task definition
        run: |
          echo "=== Container name from secret ==="
          echo "Container name: ${{ secrets.CONTAINER_NAME }}"
          echo "Container name length: ${#CONTAINER_NAME}"
          echo ""
          echo "=== Original task definition ==="
          cat ${{ env.ECS_TASK_DEFINITION }}
          echo ""
          echo "=== Container names in original task definition ==="
          cat ${{ env.ECS_TASK_DEFINITION }} | jq '.containerDefinitions[].name'
        env:
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

      - name: Render ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: app
          image: ${{ steps.build-image.outputs.image }}

      - name: Debug rendered task definition
        run: |
          echo "=== Rendered task definition file path ==="
          echo "${{ steps.task-def.outputs.task-definition }}"
          echo ""
          echo "=== Rendered task definition content ==="
          cat ${{ steps.task-def.outputs.task-definition }}
          echo ""
          echo "=== Container names in rendered task definition ==="
          cat ${{ steps.task-def.outputs.task-definition }} | jq '.containerDefinitions[].name'

      - name: Register new task definition and update ECS service
        run: |
          echo "=== Registering new task definition ==="
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "New task definition registered: $TASK_DEF_ARN"
          
          echo "=== Updating ECS service ==="
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment
          
          echo "=== Waiting for service to become stable ==="
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          
          echo "=== Deployment completed successfully ==="