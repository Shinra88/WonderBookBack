name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - prod
  pull_request:
    branches:
      - main
      - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  TASK_EXECUTION_ROLE_ARN: ${{ secrets.TASK_EXECUTION_ROLE_ARN }}

jobs:
  # 🧪 JOB 1: Test, Lint, Sécurité
  test-and-quality:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint
        continue-on-error: false

      - name: 🎨 Check Prettier formatting
        run: npm run format:check
        continue-on-error: true

      - name: 🧪 Run unit tests
        run: npm run test:run
        env:
          CI: true

      - name: 📊 Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: 🔒 Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # 🏗️ JOB 2: Build Docker & Push to ECR
  build-and-push:
    needs: test-and-quality
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build & Push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== Vérification de la structure du projet ==="
          echo "📁 Fichiers présents:"
          ls -la

          echo "🔍 Vérification des points d'entrée:"
          if [ -f "server.js" ]; then
            echo "✅ server.js trouvé"
            echo "🔍 Contenu de server.js (premières lignes):"
            head -5 server.js
          else
            echo "❌ server.js manquant!"
            exit 1
          fi

          if [ -f "app.js" ]; then
            echo "✅ app.js trouvé"
            echo "🔍 Vérification que app.js exporte bien:"
            if grep -q "module.exports" app.js; then
              echo "✅ app.js exporte correctement"
            else
              echo "⚠️ app.js pourrait ne pas exporter correctement"
            fi
          else
            echo "❌ app.js manquant!"
            exit 1
          fi

          echo "📦 Vérification package.json:"
          if [ -f "package.json" ]; then
            echo "✅ package.json trouvé"
            echo "🔍 Scripts définis:"
            cat package.json | jq '.scripts // {}'
          fi

          echo "🐳 Construction de l'image Docker..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          echo "🧪 Test de l'image en local..."
          docker run --rm -d --name test-container -p 5001:5000 \
            -e MYSQL_HOST=localhost \
            -e MYSQL_USER=test \
            -e MYSQL_ROOT_PASSWORD=test \
            -e MYSQL_DATABASE=test \
            -e MONGO_URI=mongodb://localhost:27017/test \
            -e DATABASE_URL=mysql://test:test@localhost:3306/test \
            -e JWT_SECRET=test \
            -e FRONTEND_URL=http://localhost:3000 \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG || echo "⚠️ Test local échoué (normal sans DB)"

          sleep 10

          # Vérifier que le container démarre
          if docker ps | grep -q test-container; then
            echo "✅ Container démarre correctement"
            docker logs test-container
            docker stop test-container
          else
            echo "❌ Container n'a pas démarré"
            docker logs test-container || true
            exit 1
          fi

          echo "📤 Push de l'image vers ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # 🚀 JOB 3: Deploy to ECS avec rollback automatique
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔍 Get current task definition
        run: |
          echo "=== Récupération de la task definition actuelle ==="
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query 'taskDefinition' > current-task-def.json

          echo "=== Task definition actuelle ==="
          cat current-task-def.json | jq '.family + ":" + (.revision|tostring)'

      - name: 💾 Backup current task definition
        run: |
          echo "=== Sauvegarde de la task definition pour rollback ==="
          cp current-task-def.json backup-task-def.json
          CURRENT_REVISION=$(cat current-task-def.json | jq -r '.revision')
          echo "BACKUP_REVISION=$CURRENT_REVISION" >> $GITHUB_ENV

      - name: 🛠️ Create new task definition with updated image
        run: |
          echo "=== Création de la nouvelle task definition ==="
          IMAGE_URI=${{ needs.build-and-push.outputs.image }}
          echo "Nouvelle image: $IMAGE_URI"

          jq --arg IMAGE "$IMAGE_URI" \
             'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .placementConstraints)
              | .containerDefinitions[0].image = $IMAGE' \
             current-task-def.json > task-definition-new.json

          echo "=== Vérification de la nouvelle task definition ==="
          echo "Image configurée: $(cat task-definition-new.json | jq -r '.containerDefinitions[0].image')"
      - name: 🔧 Configure task definition for longer startup
        run: |
          # Augmenter les timeouts pour les connexions DB
          jq '.containerDefinitions[0].healthCheck = {
            "command": ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"],
            "interval": 30,
            "timeout": 10,
            "retries": 5,
            "startPeriod": 120
          }' task-definition-new.json > task-definition-final.json
          mv task-definition-final.json task-definition-new.json
      - name: 🚀 Deploy new task definition to ECS
        id: deploy
        run: |
          echo "=== Enregistrement de la nouvelle task definition ==="
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Nouvelle task definition: $TASK_DEF_ARN"
          echo "NEW_TASK_DEF=$TASK_DEF_ARN" >> $GITHUB_ENV

          echo "=== Mise à jour du service ECS ==="
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --deployment-configuration "minimumHealthyPercent=50,maximumPercent=200" \
            --force-new-deployment

      - name: ⏳ Wait for deployment with advanced monitoring
        id: wait-deployment
        run: |
          echo "=== Surveillance avancée du déploiement ==="
          START_TIME=$(date +%s)
          TIMEOUT=1200  # 20 minutes (plus de temps pour les connexions DB)

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -gt $TIMEOUT ]; then
              echo "❌ Timeout atteint ($TIMEOUT secondes)"
              echo "DEPLOYMENT_STATUS=timeout" >> $GITHUB_ENV
              break
            fi
            
            # Informations détaillées du service
            SERVICE_INFO=$(aws ecs describe-services \
              --cluster ${{ env.ECS_CLUSTER }} \
              --services ${{ env.ECS_SERVICE }})
            
            SERVICE_STATUS=$(echo "$SERVICE_INFO" | jq -r '.services[0].deployments[0].status')
            RUNNING_COUNT=$(echo "$SERVICE_INFO" | jq -r '.services[0].runningCount')
            DESIRED_COUNT=$(echo "$SERVICE_INFO" | jq -r '.services[0].desiredCount')
            PENDING_COUNT=$(echo "$SERVICE_INFO" | jq -r '.services[0].pendingCount')
            
            echo "🔍 Status: $SERVICE_STATUS | Running: $RUNNING_COUNT | Desired: $DESIRED_COUNT | Pending: $PENDING_COUNT | Elapsed: ${ELAPSED}s"
            
            # Logs des tâches en cours
            echo "📋 Récupération des logs des tâches..."
            TASK_ARNS=$(aws ecs list-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --service-name ${{ env.ECS_SERVICE }} \
              --query 'taskArns[]' \
              --output text)
            
            for TASK_ARN in $TASK_ARNS; do
              echo "📝 Logs de la tâche: $TASK_ARN"
              aws logs filter-log-events \
                --log-group-name "/ecs/wonderbook-back-task" \
                --start-time $((START_TIME * 1000)) \
                --query 'events[-5:].[timestamp,message]' \
                --output text 2>/dev/null | tail -5 || echo "Pas de logs récents"
            done
            
            # Events du service
            RECENT_EVENTS=$(echo "$SERVICE_INFO" | jq -r '.services[0].events[:5][] | "\(.createdAt) - \(.message)"')
            echo "📢 Événements récents du service:"
            echo "$RECENT_EVENTS"
            
            # Vérification des health checks
            if echo "$RECENT_EVENTS" | grep -q "failed ELB health checks"; then
              echo "❌ Échec des health checks ELB détecté"
              
              # Diagnostic approfondi
              echo "🔬 Diagnostic des health checks..."
              TARGET_GROUP_ARN=$(aws elbv2 describe-target-groups \
                --names wonderbook-back-tg \
                --query 'TargetGroups[0].TargetGroupArn' \
                --output text 2>/dev/null || echo "N/A")
              
              if [ "$TARGET_GROUP_ARN" != "N/A" ]; then
                echo "🎯 Status des targets dans le load balancer:"
                aws elbv2 describe-target-health \
                  --target-group-arn $TARGET_GROUP_ARN \
                  --query 'TargetHealthDescriptions[].{Target:Target.Id,Health:TargetHealth.State,Reason:TargetHealth.Reason}' \
                  --output table 2>/dev/null || echo "Impossible de récupérer les targets"
              fi
              
              echo "DEPLOYMENT_STATUS=failed" >> $GITHUB_ENV
              break
            fi
            
            # Vérification de stabilité
            if [ "$SERVICE_STATUS" = "STEADY" ] && [ "$RUNNING_COUNT" -eq "$DESIRED_COUNT" ] && [ "$PENDING_COUNT" -eq "0" ]; then
              echo "✅ Service stable - Vérification finale..."
              
              # Test health check final
              sleep 30
              FINAL_CHECK=$(echo "$SERVICE_INFO" | jq -r '.services[0].events[0].message')
              if echo "$FINAL_CHECK" | grep -q "reached a steady state"; then
                echo "✅ Déploiement réussi et stable"
                echo "DEPLOYMENT_STATUS=success" >> $GITHUB_ENV
                break
              fi
            fi
            
            sleep 45
          done

      - name: 🔄 Rollback on failure
        if: env.DEPLOYMENT_STATUS != 'success'
        run: |
          echo "=== Rollback automatique vers la revision ${{ env.BACKUP_REVISION }} ==="

          # Revenir à l'ancienne task definition
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition wonderbook-back-task:${{ env.BACKUP_REVISION }} \
            --force-new-deployment

          echo "=== Attente de la stabilisation du rollback ==="
          timeout 600 aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

          echo "❌ Déploiement échoué - Rollback effectué vers revision ${{ env.BACKUP_REVISION }}"
          exit 1

      - name: ✅ Confirm successful deployment
        if: env.DEPLOYMENT_STATUS == 'success'
        run: |
          echo "=== Déploiement réussi ==="

          # Afficher les informations finales
          FINAL_REVISION=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].taskDefinition' \
            --output text | cut -d':' -f6)

          echo "✅ Service déployé avec succès!"
          echo "📋 Revision finale: $FINAL_REVISION"
          echo "🏗️ Image: ${{ needs.build-and-push.outputs.image }}"

          # Test de santé final
          echo "=== Test de santé final ==="
          HEALTH_ENDPOINT="https://wonderbook.net/health"
          if curl -f -s "$HEALTH_ENDPOINT" > /dev/null; then
            echo "✅ Health check endpoint répond correctement"
          else
            echo "⚠️ Health check endpoint ne répond pas (normal si pas encore exposé)"
          fi
