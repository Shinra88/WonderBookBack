# sonar-project.properties

# Informations du projet
sonar.projectKey=wonderbook-backend
sonar.projectName=WonderBook Backend
sonar.projectVersion=1.0.0

# Répertoires source
sonar.sources=src,routes,controllers,middlewares,services,utils,models
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/build/**,**/prisma/**,**/migrations/**,**/*.test.js,**/*.spec.js,jest.config.js,eslint.config.js

# Répertoires de test
sonar.tests=tests
sonar.test.inclusions=**/tests/**/*.test.js,**/tests/**/*.spec.js,**/__tests__/**/*.js
sonar.test.exclusions=**/node_modules/**

# Configuration JavaScript/Node.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-reporter.xml

# Rapports de coverage
sonar.coverage.exclusions=**/tests/**,**/*.test.js,**/*.spec.js,**/node_modules/**,jest.config.js,eslint.config.js,**/prisma/**,**/migrations/**

# Configuration générale
sonar.sourceEncoding=UTF-8
sonar.language=js

# Qualité du code
sonar.javascript.environments=node,jest

# Rapports supplémentaires
sonar.eslint.reportPaths=eslint-report.json

# Paramètres de duplication
sonar.cpd.exclusions=**/tests/**,**/*.test.js

# Exclusions pour les fichiers générés
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S125
sonar.issue.ignore.multicriteria.e1.resourceKey=**/prisma/**
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S2699
sonar.issue.ignore.multicriteria.e3.resourceKey=**/tests/**